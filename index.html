    <!-- Structured Data: Person / LocalBusiness -->

        "@type": "PostalAddress",
        "addressLocality": "Ludwigsburg",
        "addressRegion": "Baden-Württemberg",
        "addressCountry": "DE"
      },
      "areaServed": ["Ludwigsburg", "Stuttgart", "Baden-Württemberg"],
      "knowsAbout": ["TYPO3", "Shopify", "WordPress", "Webflow", "Framer", "Vue.js", "TypeScript", "React", "SEO", "Barrierefreiheit"],

    </script>

    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Was kostet eine Website beim Freelancer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Der Preis hängt vom Umfang ab. Eine professionelle Unternehmenswebsite liegt typischerweise zwischen 2.000 und 8.000 €. Shopify-Shops oder komplexere Frontends können darüber liegen. Ich kalkuliere transparent nach Aufwand – kein verstecktes Agentur-Overhead."
          }
        },
        {
          "@type": "Question",
          "name": "Wie lange dauert die Entwicklung einer Website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Eine einfache Website mit 5–8 Seiten ist in 3–5 Wochen fertig. Ein größerer Relaunch oder ein individueller Shop braucht 6–10 Wochen. Ich plane realistisch und halte Deadlines ein."
          }
        },
        {
          "@type": "Question",
          "name": "Welche CMS-Systeme verwendest du?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ich arbeite mit WordPress, TYPO3, Shopify, Webflow und Framer – je nachdem, was für dein Projekt und dein Team am sinnvollsten ist. Du kannst Inhalte nach dem Launch selbst pflegen, ohne Entwickler-Wissen."
          }
        },
        {
          "@type": "Question",
          "name": "Arbeitest du auch remote oder nur vor Ort?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Beides ist möglich. Ich bin in Ludwigsburg ansässig und arbeite regelmäßig mit Kunden aus Stuttgart und der Region – remote funktioniert aber genauso gut. Die meisten Projekte laufen vollständig remote über Calls und geteilte Tools."
          }
        },
        {
          "@type": "Question",
          "name": "Bietest du nach dem Launch auch Wartung und Support an?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja. Ich begleite Projekte auch nach dem Launch: Updates, Sicherheits-Patches, Erweiterungen oder neue Unterseiten. Viele Kunden arbeiten langfristig mit mir zusammen, anstatt jedes Mal von vorne anzufangen."
          }
        },
        {
          "@type": "Question",
          "name": "Übernimmst du auch bestehende Websites zur Weiterentwicklung?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja, das ist ein großer Teil meiner Arbeit. Ich schaue mir bestehende Projekte an, analysiere Code-Qualität und Performance, und entwickle gezielt weiter – ohne unnötigen Komplettumbau."
          }
        }
      ]
    }
    </script>
